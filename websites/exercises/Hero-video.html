<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Block with Video</title>
    <link rel="preload" href="assets/videos/hero-still.jpg" as="image">
<meta name="description"
content="A hero block with a background video that plays in a continuous loop and includes a tinted overlay.">
    <!-- Link to Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom styles -->
    <style type="text/tailwindcss">

header::before {
    content: "";
    @apply absolute inset-0 bg-black/40;
}     

header h1,
header h2 { @apply text-shadow-lg/10; }

header {
    @apply min-h-[60vh] md:min-h-[80vh]
        bg-cover bg-center
        flex flex-col justify-center
        px-8 lg:px-60 py-12
        text-center;
}

    header h1 {
    @apply text-7xl md:text-8xl
        text-white font-bold
        tracking-tight
        mb-6
    }

    header h2 {
    @apply text-4xl md:text-5xl
        text-white;
    }

.slide-in-top {
	animation: slide-in-top 1s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
}

/* ----------------------------------------------
 * Generated by Animista on 2026-10-12 15:7:53
 * Licensed under FreeBSD License.
 * See http://animista.net/license for more info. 
 * w: http://animista.net, t: @cssanimista
 * ---------------------------------------------- */

/**
 * ----------------------------------------
 * animation slide-in-top
 * ----------------------------------------
 */
@keyframes slide-in-top {
0% {
    transform: translateY(-1000px);
    opacity: 0;
}
100% {
    transform: translateY(0);
    opacity: 1;
}
}

.slide-in-left {
	animation: slide-in-left 1s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
}

/* ----------------------------------------------
 * Generated by Animista on 2026-10-12 15:12:42
 * Licensed under FreeBSD License.
 * See http://animista.net/license for more info. 
 * w: http://animista.net, t: @cssanimista
 * ---------------------------------------------- */

/**
 * ----------------------------------------
 * animation slide-in-left
 * ----------------------------------------
 */
@keyframes slide-in-left {
0% {
    transform: translateX(-1000px);
    opacity: 0;
}
100% {
    transform: translateX(0);
    opacity: 1;
}
}


    </style>

</head>
    <h1>Education for Life</h1>

    <h2>A brighter career and future</h2>

<body>

    <!-- hero block -->
<header>
    <video
        autoplay
        muted
        loop
        playsinline
        poster="assets/videos/hero-still.jpg">

        <source
            src="assets/videos/hero-video.mp4"
            type="video/mp4">
    </video>

    <h1>Albert Camus</h1>

    <h2>Creative Web Developer</h2>

</header>
    <!-- /hero block -->

</body>
</html>
